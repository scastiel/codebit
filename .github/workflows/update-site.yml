name: update site and compositions

on:
  workflow_dispatch:
    inputs:
      envToDeploy:
        description: 'on which env do you want to deploy?'
        type: choice
        options:
          - dev
          - prod
        required: true

jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: Set Environment Variable
        run: |
          if [ ${{ inputs.envToDeploy }} == 'prod' ]; then
            echo "REGION=us-east-2" >> "$GITHUB_ENV"
          elif [ ${{ inputs.envToDeploy }} == 'dev' ]; then
            echo "REGION=ca-central-1" >> "$GITHUB_ENV"
          fi
      - name: update site and compositions
        run: ./updateComposition.sh
        env:
          AWS_REGION: ${REGION}
          REMOTION_AWS_ACCESS_KEY_ID: ${{ secrets.REMOTION_AWS_ACCESS_KEY_ID }}
          REMOTION_AWS_SECRET_ACCESS_KEY: ${{ secrets.REMOTION_AWS_SECRET_ACCESS_KEY}}
